[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eoh-catalog-agent"
version = "0.3.0"
description = "Turn supplier catalogs into checked Shopify and WooCommerce imports."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
eoh-catalog-agent = "eoh_catalog_agent.cli:entrypoint"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
